<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8fdff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#4dd9ff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#00b8d9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00b8d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e3" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ff9d1f" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#ff6a00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="55%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4dd9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9d1f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" fill="url(#bgGrad)"/>

  <!-- faint starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1" opacity="0.5"/>
    <circle cx="140" cy="90" r="1.2" opacity="0.3"/>
    <circle cx="810" cy="55" r="1" opacity="0.4"/>
    <circle cx="760" cy="260" r="1.3" opacity="0.35"/>
    <circle cx="40" cy="270" r="1" opacity="0.4"/>
    <circle cx="450" cy="30" r="1" opacity="0.3"/>
    <circle cx="450" cy="290" r="1" opacity="0.3"/>
  </g>

  <!-- ===== ARC REACTOR (left) ===== -->
  <g transform="translate(210,160)">
    <circle r="98" fill="none" stroke="#2a2a33" stroke-width="10"/>
    <circle r="98" fill="none" stroke="#4dd9ff" stroke-width="2" opacity="0.55">
      <animate attributeName="r" values="93;101;93" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- outer strut ring -->
    <g stroke="#7fe9ff" stroke-width="3" opacity="0.85">
      <line x1="0" y1="-78" x2="0" y2="-48"/>
      <line x1="0" y1="78" x2="0" y2="48"/>
      <line x1="67" y1="-39" x2="41" y2="-24"/>
      <line x1="-67" y1="-39" x2="-41" y2="-24"/>
      <line x1="67" y1="39" x2="41" y2="24"/>
      <line x1="-67" y1="39" x2="-41" y2="24"/>
    </g>

    <circle r="60" fill="url(#reactorGlow)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="#ffffff">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="19;23;19" dur="1.1s" repeatCount="indefinite"/>
    </circle>

    <text x="0" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#8fdcff" letter-spacing="2">MARK · AI REACTOR</text>
  </g>

  <!-- ===== SLING RING PORTAL (right) ===== -->
  <g transform="translate(690,160)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      <circle r="92" fill="none" stroke="#ff9d1f" stroke-width="1.5" stroke-dasharray="3 8" opacity="0.75"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="13s" repeatCount="indefinite"/>
      <circle r="72" fill="none" stroke="#ffc26b" stroke-width="1" stroke-dasharray="2 11" opacity="0.6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/>
      <circle r="54" fill="none" stroke="#ffe0b3" stroke-width="1" stroke-dasharray="1 6" opacity="0.5"/>
    </g>

    <circle r="52" fill="url(#portalGlow)">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="15" fill="#fff8e7">
      <animate attributeName="r" values="11;17;11" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="0" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#ffc98f" letter-spacing="2">KAMAR-TAJ PORTAL</text>
  </g>

  <!-- energy beam connecting the two -->
  <line x1="318" y1="160" x2="582" y2="160" stroke="url(#beamGrad)" stroke-width="2">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="318" y1="160" x2="582" y2="160" stroke="#FFD700" stroke-width="1" stroke-dasharray="6 10" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- HUD readout text -->
  <text x="450" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#FFD700" letter-spacing="4">
    SYSTEMS ONLINE
    <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#8a8fa3" letter-spacing="3">SANCTUM LINKED  ·  REACTOR STABLE  ·  MULTIVERSE SYNCHRONIZED</text>

  <!-- bottom HUD tick marks -->
  <g stroke="#3a3a46" stroke-width="1">
    <line x1="60" y1="300" x2="840" y2="300"/>
  </g>
  <g fill="#5c5c70" font-family="Consolas, monospace" font-size="10">
    <text x="60" y="315">ARC REACTOR // OPERATIONAL</text>
    <text x="700" y="315">PORTAL // STABLE</text>
  </g>
</svg>
